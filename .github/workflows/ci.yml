name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-check:
    name: Verify Android metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Android version format
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          gradle = pathlib.Path("HomelabAndroid/app/build.gradle.kts").read_text()
          version_name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle)
          version_code = re.search(r'versionCode\s*=\s*(\d+)', gradle)
          if not version_name or not version_code:
              print("Could not read Android versionName/versionCode", file=sys.stderr)
              sys.exit(1)
          print(f"Android version: {version_name.group(1)} (code {version_code.group(1)})")
          PY

      - name: Ensure release binaries are not tracked in git
        run: |
          tracked="$(git ls-files '*.ipa' '*.apk' '*.aab')"
          if [ -n "$tracked" ]; then
            echo "Release binaries must not be committed to source control:"
            echo "$tracked"
            exit 1
          fi

  android-build:
    name: Android Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: HomelabAndroid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin Debug
        run: ./gradlew :app:compileDebugKotlin --console=plain

      - name: Run Unit & Security Tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Assemble Release APK
        run: ./gradlew :app:assembleRelease --console=plain
